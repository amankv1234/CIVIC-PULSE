version: '3.9'

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: civicpulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-civicpulse}
      POSTGRES_USER: ${DB_USER:-civicpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-civicpulse_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-civicpulse} -d ${DB_NAME:-civicpulse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicpulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: civicpulse_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-civicpulse}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-civicpulse}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-civicpulse_dev_pass}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_UPLOAD_DIR: /app/uploads
      APP_FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: civicpulse_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
      NEXT_PUBLIC_UPLOAD_URL: http://localhost:8080/uploads
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
