version: '3.9'

services:
  mongo:
    image: mongo:latest
    container_name: civicpulse_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-civicpulse_dev_pass}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: civicpulse_backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://${DB_USER:-admin}:${DB_PASSWORD:-civicpulse_dev_pass}@mongo:27017/civicpulse?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-must-be-at-least-256-bits-long-for-hs256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PORT: 8080
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
      - /app/node_modules
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: civicpulse_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
      NEXT_PUBLIC_UPLOAD_URL: http://localhost:8080/uploads
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
